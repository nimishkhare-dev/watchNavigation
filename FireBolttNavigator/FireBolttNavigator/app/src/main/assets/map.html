<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html,body,#map{height:100%;width:100%;margin:0;padding:0;background:#e8edf2;overflow:hidden}
    .leaflet-control-attribution{font-size:9px!important}
    .nav-marker{width:34px;height:34px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 2px 4px #26344966)}
    .nav-marker svg{width:34px;height:34px;transform-origin:50% 50%;transition:transform .45s ease}
    .dest-dot{width:16px;height:16px;border-radius:50%;background:#ef4444;border:3px solid white;box-shadow:0 1px 7px #243247}
    .leaflet-control-zoom a{border-radius:10px!important}
    .recenter{background:white;border:0;border-radius:12px;width:44px;height:44px;font-size:22px;box-shadow:0 2px 10px #17203333}
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  let map=L.map('map',{zoomControl:false,preferCanvas:true,zoomAnimation:true}).setView([20.5937,78.9629],5);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
  L.control.zoom({position:'topright'}).addTo(map);
  let routeLayer=null,currentMarker=null,destinationMarker=null,startMarker=null,followMode=true,lastBearing=0;
  const navIcon=L.divIcon({className:'',html:'<div class="nav-marker"><svg id="navArrow" viewBox="0 0 40 40"><path d="M20 2 L35 35 L20 28 L5 35 Z" fill="#1687f8" stroke="white" stroke-width="3" stroke-linejoin="round"/></svg></div>',iconSize:[40,40],iconAnchor:[20,20]});
  const destIcon=L.divIcon({className:'',html:'<div class="dest-dot"></div>',iconSize:[22,22],iconAnchor:[11,11]});
  function setRoute(points,start,destination){
    if(routeLayer)map.removeLayer(routeLayer);if(startMarker)map.removeLayer(startMarker);if(destinationMarker)map.removeLayer(destinationMarker);
    const ll=points.map(p=>[p[0],p[1]]);
    routeLayer=L.polyline(ll,{color:'#087fce',weight:8,opacity:.22,lineCap:'round',lineJoin:'round'}).addTo(map);
    L.polyline(ll,{color:'#087fce',weight:5,opacity:.96,lineCap:'round',lineJoin:'round'}).addTo(map);
    if(start)startMarker=L.circleMarker(start,{radius:6,color:'#fff',weight:2,fillColor:'#16a34a',fillOpacity:1}).addTo(map);
    if(destination)destinationMarker=L.marker(destination,{icon:destIcon}).addTo(map);
    if(start){map.setView(start,17,{animate:true,duration:1});followMode=true;}
  }
  function setCurrent(lat,lon,bearing,accuracy){
    if(!Number.isFinite(lat)||!Number.isFinite(lon))return;
    const p=L.latLng(lat,lon);
    if(!currentMarker)currentMarker=L.marker(p,{icon:navIcon,zIndexOffset:1200,interactive:false}).addTo(map);else currentMarker.setLatLng(p);
    if(Number.isFinite(bearing)){lastBearing=bearing;const arrow=document.getElementById('navArrow');if(arrow)arrow.style.transform='rotate('+bearing+'deg)';}
    if(followMode){if(map.getZoom()<16)map.setZoom(17,{animate:true});map.panTo(p,{animate:true,duration:.7,easeLinearity:.25});}
  }
  function recenter(){followMode=true;if(currentMarker){map.setView(currentMarker.getLatLng(),17,{animate:true,duration:.8});}}
  map.on('dragstart',()=>{followMode=false;});
  window.addEventListener('resize',()=>setTimeout(()=>map.invalidateSize(),100));
</script>
</body></html>
